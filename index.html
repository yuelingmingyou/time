<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奥术档案室 · ARCANE ARCHIVE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="brand">
        <span class="brand-plate">
          <span class="brand-cn">奥术档案室</span>
          <span class="brand-en">ARCANE CHRONICLE ARCHIVE</span>
        </span>
      </a>
      <nav class="main-nav">
        <a href="#/" data-route="timeline">时间轴</a>
        <a href="#/chars" data-route="chars">人物档案</a>
        <a href="#/network" data-route="network">关系图谱</a>
        <a href="#/spacetime" data-route="spacetime">时空检索</a>
        <button id="edit-toggle" class="edit-toggle" type="button">✎ 编辑模式</button>
      </nav>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <span id="footer-note">奥术统合局档案科 · 机密等级以上禁止外传</span>
  </footer>

  <div id="edit-toolbar" class="edit-toolbar" hidden>
    <button id="btn-export" type="button">导出 data.js</button>
    <button id="btn-import" type="button">导入数据</button>
    <button id="btn-reset" type="button">恢复初始数据</button>
    <input type="file" id="import-file" accept=".js,.json" hidden>
  </div>

<script src="app.js"></script>
</body>
</html>
